name: Publish Cycle Terminal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cycle-terminal-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public static site
        uses: actions/checkout@v4
      - name: Validate JavaScript and localized research pages
        run: |
          node --check docs/app.js
          node --check docs/motion.js
          python3 -m py_compile scripts/collect_btc_history.py scripts/collect_market_data.py scripts/collect_fred.py scripts/run_data_pipeline.py
          python3 - <<'PY'
          from pathlib import Path
          page=Path('docs/index.html').read_text(encoding='utf-8')
          assert 'id="strategyPage"' in page
          assert 'id="sentimentPage"' in page
          assert 'id="divergencePlot"' in page
          assert 'lang="ko"' in page
          print('Static research sections and JavaScript syntax validated')
          PY
      - name: Collect and validate market history (independent sources)
        run: python3 scripts/run_data_pipeline.py
      - name: Preserve all validated datasets after collection
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in docs/data/btc-history.json docs/data/etf-flows.json docs/data/funding-history.json docs/data/oi-history.json docs/data/collection-status.json docs/data/fred-dgs10.json docs/data/fred-dfii10.json docs/data/fred-m2sl.json docs/data/fred-walcl.json; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: persist validated market observations and source status [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
